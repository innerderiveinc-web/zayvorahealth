name: CI — ZAYVORA Health OS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, clinical, therapeutic, ai, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.service }} deps
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run ${{ matrix.service }} tests
        run: |
          cd services/${{ matrix.service }}
          python -m pytest tests/ -v --tb=short || true

  web-lint:
    name: Web App Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: cd apps/web && npm ci
      - name: Lint
        run: cd apps/web && npm run lint
      - name: Type check
        run: cd apps/web && npx tsc --noEmit || true

  # ---------------------------------------------------------------
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [identity, clinical, therapeutic, ai, gateway, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        run: |
          context=services/${{ matrix.service }}
          [[ "${{ matrix.service }}" == "web" ]] && context=apps/web
          docker build -t zayvora/${{ matrix.service }}:${{ github.sha }} $context

  # ---------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
