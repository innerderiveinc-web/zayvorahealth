name: ZAYVORA Quality Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify JavaScript Syntax
        run: |
          node --check js/zayvora-core.js
          node --check js/zayvora-extensions.js
          node --check sw.js
      - name: Verify Python Syntax Across Entire Repository
        run: |
          python3 -m compileall -q services/ scripts/ database/
      - name: Verify JSON Integrity
        run: |
          python3 -c "import json; [json.load(open(f)) for f in ['manifest.json', 'railway.json']]"
