# ==============================================================================
# ZAYVORA Health OS™ — Production Nginx Reverse Proxy & TLS Hardening
# Compliance: DPDP Act 2023, DISHA, HIPAA Security Rule, 21 CFR Part 11
# ==============================================================================

# Rate limiting zone for clinical API endpoints (30 requests/sec per IP)
limit_req_zone $binary_remote_addr zone=zayvora_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=zayvora_auth_limit:10m rate=5r/s;

upstream zayvora_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP to HTTPS Strict Redirect
server {
    listen 80;
    listen [::]:80;
    server_name zayvora.local health.zayvora.com _;

    # Allow ACME Challenge for Let's Encrypt automated certificate renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Hardened HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zayvora.local health.zayvora.com _;

    # SSL / TLS Cryptographic Hardening
    ssl_certificate /etc/ssl/certs/zayvora.crt;
    ssl_certificate_key /etc/ssl/private/zayvora.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Statutory Healthcare Security & Anti-Clickjacking Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;

    # Max body size for diagnostic imaging and LIMS lab uploads
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Authentication Endpoints Rate-Limiting Gate
    location /api/v1/auth/ {
        limit_req zone=zayvora_auth_limit burst=10 nodelay;
        proxy_pass http://zayvora_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clinical API Routes
    location /api/ {
        limit_req zone=zayvora_api_limit burst=50 nodelay;
        proxy_pass http://zayvora_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Real-Time Telemedicine & WebRTC Gateway
    location /telemedicine/ {
        proxy_pass http://zayvora_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Static UI & Progressive Web App (PWA) Delivery
    location / {
        proxy_pass http://zayvora_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # PWA Service Worker caching policy
        location ~* (sw\.js|manifest\.json)$ {
            proxy_pass http://zayvora_backend;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
