# ============================================================
# docker-compose.override.yml — Local Development Overrides
# Hot-reload, debug logging, dev tools (pgAdmin, Redis Commander, Mailhog)
# ============================================================
version: "3.9"

services:
  identity:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    volumes:
      - ./services/identity:/app
    environment:
      LOG_LEVEL: debug

  clinical:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    volumes:
      - ./services/clinical:/app
    environment:
      LOG_LEVEL: debug

  clinical-worker:
    volumes:
      - ./services/clinical:/app
    environment:
      LOG_LEVEL: debug

  knowledge:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    volumes:
      - ./services/knowledge:/app
    environment:
      LOG_LEVEL: debug

  therapeutic:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    volumes:
      - ./services/therapeutic:/app
    environment:
      LOG_LEVEL: debug

  ai:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    volumes:
      - ./services/ai:/app
    environment:
      LOG_LEVEL: debug

  gateway:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    volumes:
      - ./services/gateway:/app
    environment:
      LOG_LEVEL: debug

  web:
    command: ["npm", "run", "dev"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  # -----------------------------------------------------------------
  # Dev-only services
  # -----------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zayvora.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - zayvora_pgadmin_data:/var/lib/pgadmin

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      - redis

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  zayvora_pgadmin_data:
