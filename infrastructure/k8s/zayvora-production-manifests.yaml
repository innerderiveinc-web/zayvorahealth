# ------------------------------------------------------------------------------
# 8. ZAYVORA Gateway (Unified Edge Proxy, Health Aggregator, Rate Limiter)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zayvora-gateway
  namespace: zayvora-production
  labels:
    app.kubernetes.io/name: zayvora-gateway
    app.kubernetes.io/part-of: zayvora-health
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zayvora-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zayvora-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/zayvora-health/zayvora-gateway:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: zayvora-production-config
            - secretRef:
                name: zayvora-production-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: zayvora-gateway
  namespace: zayvora-production
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: zayvora-gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http

---
# ------------------------------------------------------------------------------
# 9. Horizontal Pod Autoscaling (HPA v2) Policies
# ------------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zayvora-ai-hpa
  namespace: zayvora-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zayvora-ai
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zayvora-clinical-hpa
  namespace: zayvora-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zayvora-clinical
  minReplicas: 4
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

---
# ------------------------------------------------------------------------------
# 10. Zero-Trust Network Policy (Service Mesh Pod-to-Pod Isolation)
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: zayvora-production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  namespace: zayvora-production
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [zayvora-identity, zayvora-clinical, zayvora-knowledge, zayvora-therapeutic, zayvora-ai]}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zayvora-gateway
      ports:
        - protocol: TCP
          port: 8000
