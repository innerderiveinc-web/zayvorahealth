apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zayvora.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zayvora.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENABLE_OTEL_TRACING: {{ .Values.config.enableOtelTracing | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelCollectorEndpoint | quote }}
  GATEWAY_SERVICE_URL: "http://zayvora-gateway.{{ .Values.namespace }}.svc.cluster.local:8000"
  IDENTITY_SERVICE_URL: "http://zayvora-identity.{{ .Values.namespace }}.svc.cluster.local:8005"
  CLINICAL_SERVICE_URL: "http://zayvora-clinical.{{ .Values.namespace }}.svc.cluster.local:8001"
  KNOWLEDGE_SERVICE_URL: "http://zayvora-knowledge.{{ .Values.namespace }}.svc.cluster.local:8002"
  THERAPEUTIC_SERVICE_URL: "http://zayvora-therapeutic.{{ .Values.namespace }}.svc.cluster.local:8003"
  AI_SERVICE_URL: "http://zayvora-ai.{{ .Values.namespace }}.svc.cluster.local:8004"
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
