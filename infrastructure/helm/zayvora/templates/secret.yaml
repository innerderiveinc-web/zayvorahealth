{{- if and .Values.secrets (and .Values.secrets.externalSecret .Values.secrets.externalSecret.enabled) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "zayvora.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zayvora.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name | default "vault-backend" }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "zayvora.fullname" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.externalSecret.vaultKeyPath | default "secret/data/zayvora/production" }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zayvora.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zayvora.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.secrets .Values.secrets.values }}
  {{- range $key, $val := .Values.secrets.values }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- else }}
  DATABASE_URL: "postgresql+psycopg://zayvora_user:${VAULT_MANAGED_DB_PASSWORD}@postgres.{{ .Values.namespace }}.svc.cluster.local:5432/zayvora"
  REDIS_URL: "rediss://:${VAULT_MANAGED_REDIS_TOKEN}@redis.{{ .Values.namespace }}.svc.cluster.local:6379/0"
  NEO4J_URI: "neo4j+s://neo4j.{{ .Values.namespace }}.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "${VAULT_MANAGED_NEO4J_PASSWORD}"
  JWT_PUBLIC_KEY_PEM: "${VAULT_MANAGED_JWT_PUBLIC_KEY}"
  JWT_PRIVATE_KEY_PEM: "${VAULT_MANAGED_JWT_PRIVATE_KEY}"
  {{- end }}
{{- end }}
