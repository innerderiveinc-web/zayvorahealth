apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zayvora.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zayvora.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://zayvora_user:VaultManagedPassword@postgres.{{ .Values.namespace }}.svc.cluster.local:5432/zayvora"
  REDIS_URL: "rediss://:VaultManagedRedisToken@redis.{{ .Values.namespace }}.svc.cluster.local:6379/0"
  NEO4J_URI: "neo4j+s://neo4j.{{ .Values.namespace }}.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "VaultManagedNeo4jPassword"
  JWT_PUBLIC_KEY_PEM: "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAvZayvoraProductionKey...\n-----END PUBLIC KEY-----"
  JWT_PRIVATE_KEY_PEM: "-----BEGIN RSA PRIVATE KEY-----\nVaultManagedRS256PrivateKey...\n-----END RSA PRIVATE KEY-----"
