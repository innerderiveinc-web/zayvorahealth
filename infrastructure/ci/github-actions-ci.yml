name: ZAYVORA Health OS — CI/CD Quality Gate & Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: "Python ${{ matrix.python-version }} Quality Gate & Tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Automated Quality Gate (Pre-Commit Shield)
        run: |
          python3 scripts/quality_gate.py

      - name: Verify Frontend Domain Modules & Syntax
        run: |
          python3 scripts/bundle_frontend.py

      - name: Run Codebase Integrity & Static Parity Tests
        run: |
          python3 -m unittest tests/test_codebase_integrity_and_parity.py

      - name: Run Database Adapter & Pluggability Tests
        run: |
          python3 -m unittest tests/test_database_adapter.py

      - name: Run Full Automated Test Suite (732 Tests)
        run: |
          python3 -m unittest discover -s tests
